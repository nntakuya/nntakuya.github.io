<h1>ハヤトレ｜筋トレ記録とメニュー</h1>
<p class="lead">ジムで手を止めずに筋トレを記録する iPhone アプリです。</p>
<p>種目ごとに予定のセット数が行で並び、重さと回数は前回の値が最初から入っています。完了を押すだけで進みます。休憩タイマーは、ロック画面や Dynamic Island にも出ます。</p>
<p>アカウント登録は不要で、記録は端末内だけに保存されます。記録中の画面を除く画面の下に、バナー広告が表示されます。</p>
