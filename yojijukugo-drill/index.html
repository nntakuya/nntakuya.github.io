<p class="lead">四字熟語を、穴埋めと意味の2種類の問題で覚える、1日5分のアプリです。</p>
<p>500語の四字熟語を収録しています。問題と解説はすべて自作です。間違えた語は間隔をあけて出し直すので、覚えきれていない語を少しずつ減らせます。</p>
<p>無料で使えます。アカウント登録は不要で、学習の記録は端末内だけに保存されます。</p>
